<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học Quản lý dự án CNTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: thanh trên cố định · mục lục khóa học bên trái · cột đọc ở giữa (~760px) · "Trong bài này" bên phải.
   Màn ≥1280px: 3 cột · 1024–1279px: 2 cột (ẩn cột phải) · <1024px: mục lục thành ngăn kéo. */
:root {
  --paper: #f5f6f8;
  --surface: #ffffff;
  --sunken: #eef0f4;
  --ink: #121826;
  --muted: #5b6474;
  --line: #e2e5eb;
  --accent: #2f4fd8;
  --accent-ink: #ffffff;
  --accent-soft: #eef1fd;
  --marker: #b45309;
  --marker-soft: #fdf3e4;
  --good: #15803d;
  --good-soft: #e6f4ea;
  --good-ink: #ffffff;
  --bad: #c0262d;
  --bad-soft: #fdecec;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --top-h: 60px;
  --side-w: 296px;
  --rail-w: 252px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1117; --surface: #151b24; --sunken: #10151d; --ink: #e6e9ef; --muted: #98a2b3; --line: #252d39;
    --accent: #8fa3ff; --accent-ink: #0d1117; --accent-soft: #1b2340; --marker: #f2a65a; --marker-soft: #33240f;
    --good: #6dd28f; --good-soft: #14291c; --good-ink: #0d1117; --bad: #ff8a8a; --bad-soft: #3a1a1c;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1117; --surface: #151b24; --sunken: #10151d; --ink: #e6e9ef; --muted: #98a2b3; --line: #252d39;
  --accent: #8fa3ff; --accent-ink: #0d1117; --accent-soft: #1b2340; --marker: #f2a65a; --marker-soft: #33240f;
  --good: #6dd28f; --good-soft: #14291c; --good-ink: #0d1117; --bad: #ff8a8a; --bad-soft: #3a1a1c;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-padding-top: calc(var(--top-h) + 16px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.25; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 2.1rem; font-weight: 800; }
h2 { font-size: 1.4rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.3rem; display: grid; gap: .4rem; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex: none; }

/* ---------- Khung ứng dụng ---------- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0,1fr) var(--rail-w); grid-template-rows: var(--top-h) 1fr; grid-template-areas: "top top top" "side main rail"; min-height: 100vh; }
.topbar { grid-area: top; position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 0 16px; height: var(--top-h); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.iconbtn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--muted); }
.iconbtn:hover { background: var(--sunken); color: var(--ink); }
.iconbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.top-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-mono); font-size: .72rem; font-weight: 700; flex: none; text-decoration: none; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: .88rem; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--ink); }
.crumbs b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.crumbs .sep { opacity: .5; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.cprog { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); padding: 4px 10px 4px 4px; border-radius: 99px; background: var(--sunken); margin-right: 4px; white-space: nowrap; }
.ring { --p: 0; width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; }
.ring::after { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--sunken); }
.cprog b { color: var(--ink); font-family: var(--font-mono); }
#account-top:empty { display: none; }
#account-top .pf-btn { white-space: nowrap; padding: 7px 14px; }
#account-top .pf-chip span:first-child { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Mục lục trái ---------- */
.sidebar { grid-area: side; position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px 28px; display: grid; gap: 18px; align-content: start; scrollbar-width: thin; }
.course-card { padding: 4px 8px 2px; display: grid; gap: 8px; }
.course-card .t { font-weight: 800; font-size: 1.02rem; line-height: 1.3; }
.course-card .s { font-size: .8rem; color: var(--muted); }
.bar { height: 6px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; border-radius: 99px; transition: width .3s; }
.nvgroup { display: grid; gap: 1px; }
.nvlabel { font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); padding: 0 10px 6px; font-weight: 700; }
.nv { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); padding: 7px 10px; border-radius: 8px; font-size: .9rem; line-height: 1.35; }
.nv:hover { background: var(--sunken); }
.nv.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nv .tag { margin-left: auto; font-family: var(--font-mono); font-size: .7rem; color: var(--muted); }
.nv.active .tag { color: var(--accent); }
.mod { border-radius: 10px; }
.mod-head { width: 100%; display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.mod-head:hover { background: var(--sunken); }
.mod-code { font-family: var(--font-mono); font-size: .74rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 3px 0; text-align: center; }
.mod-name { font-size: .9rem; font-weight: 600; line-height: 1.3; }
.mod-meta { font-size: .72rem; color: var(--muted); font-family: var(--font-mono); display: flex; align-items: center; gap: 6px; }
.chev { transition: transform .2s; color: var(--muted); }
.mod.open .chev { transform: rotate(90deg); }
.mod-body { display: none; padding: 2px 0 6px 14px; margin-left: 14px; border-left: 1px solid var(--line); }
.mod.open .mod-body { display: grid; gap: 1px; }
.ses { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; text-decoration: none; color: var(--ink); padding: 6px 8px; border-radius: 8px; font-size: .84rem; line-height: 1.4; }
.ses:hover { background: var(--sunken); }
.ses .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; margin-top: 1px; font-size: .62rem; font-family: var(--font-mono); color: var(--muted); background: var(--surface); }
.ses.done .dot { background: var(--good); border-color: var(--good); color: var(--good-ink); }
.ses.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ses.cur .dot { border-color: var(--accent); color: var(--accent); }
.ses.done.cur .dot { background: var(--good); color: var(--good-ink); border-color: var(--good); }
.ses.ov { color: var(--muted); font-size: .8rem; }

/* ---------- Cột nội dung ---------- */
main { grid-area: main; min-width: 0; padding: 36px clamp(20px, 4vw, 56px) 80px; }
main > * { width: 100%; max-width: 780px; margin-left: auto; margin-right: auto; }
main:focus { outline: none; }
main { display: grid; gap: 30px; align-content: start; }
.lead { color: var(--muted); max-width: 68ch; font-size: 1.04rem; }
.head { display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-body); font-size: .74rem; color: var(--marker); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.eyebrow a { color: inherit; text-decoration: none; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 12px; align-content: start; box-shadow: var(--shadow); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { display: grid; gap: 4px; }
.stat .num { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 700; }
.stat .cap { font-size: .84rem; color: var(--muted); }

.modlist { display: grid; gap: 10px; }
.modrow { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-decoration: none; color: var(--ink); box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.modrow:hover { border-color: var(--accent); transform: translateY(-1px); }
.modrow .code { font-family: var(--font-mono); font-weight: 700; color: var(--accent); font-size: 1rem; background: var(--accent-soft); border-radius: 10px; height: 44px; display: grid; place-items: center; }
.modrow .sub { font-size: .84rem; color: var(--muted); }
.pill { font-size: .74rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.pill.done { background: var(--good-soft); color: var(--good); }
.pill.part { background: var(--marker-soft); color: var(--marker); }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; background: var(--sunken); }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--sunken) 55%, transparent); }
tr.modsep td { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.check.is-done span { color: var(--muted); }
.deliver { font-weight: 600; }
.deliver::before { content: "★ "; color: var(--marker); }

.section { display: grid; gap: 14px; }
.callout { border-left: 3px solid var(--marker); background: var(--marker-soft); padding: 14px 18px; border-radius: 0 12px 12px 0; }
.mistakes li::marker { content: "✕  "; color: var(--bad); }
pre { font-family: var(--font-mono); font-size: .84rem !important; line-height: 1.6; background: var(--sunken) !important; border: 1px solid var(--line); border-radius: 12px !important; padding: 14px 16px !important; overflow-x: auto; }

details.case { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
details.case > summary { cursor: pointer; padding: 15px 18px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
details.case > summary::-webkit-details-marker { display: none; }
details.case[open] > summary { border-bottom: 1px solid var(--line); }
details.case .body { padding: 14px 18px 18px; display: grid; gap: 10px; }
.hint { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 9px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: .92rem; text-decoration: none; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); filter: none; }
.btn.is-done { background: var(--good); border-color: var(--good); color: var(--good-ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.q { display: grid; gap: 10px; }
.q .stem { font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt .k { font-family: var(--font-mono); font-weight: 700; color: var(--muted); }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.explain { font-size: .92rem; padding: 10px 12px; border-radius: 10px; background: var(--sunken); }
.score { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.score .big { font-family: var(--font-mono); font-size: 2rem; font-weight: 700; }
.verdict { font-weight: 700; padding: 4px 12px; border-radius: 99px; }
.verdict.pass { background: var(--good-soft); color: var(--good); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); }

.calc { display: grid; gap: 12px; }
.calc .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.calc label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); font-weight: 600; }
.calc input { font: inherit; font-family: var(--font-mono); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunken); color: var(--ink); width: 100%; }
.results { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.res { background: var(--sunken); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.res b { font-family: var(--font-mono); font-size: 1.25rem; }
.res span { font-size: .78rem; color: var(--muted); }
.res.badv b { color: var(--bad); } .res.goodv b { color: var(--good); }
.search { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; width: 100%; max-width: 420px; background: var(--surface); color: var(--ink); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; }
.toast.show { opacity: 1; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; }
.pager a { text-decoration: none; font-weight: 600; }
.pdfcard { padding: 14px 18px; border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); box-shadow: none; }
.pdficon { font-family: var(--font-mono); font-weight: 700; font-size: .72rem; color: #fff; background: var(--bad); border-radius: 6px; padding: 8px 7px; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; }

/* ---------- Trang bài giảng ---------- */
.lesson-hero { display: grid; gap: 14px; padding-bottom: 6px; }
.lesson-hero h1 { font-size: clamp(1.8rem, 2.6vw, 2.35rem); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: .8rem; padding: 4px 11px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.chip.ok { background: var(--good-soft); color: var(--good); border-color: transparent; font-weight: 600; }
.steps { display: flex; align-items: center; gap: 0; margin-top: 4px; }
.step { display: flex; align-items: center; text-decoration: none; }
.step i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--font-mono); font-size: .76rem; font-weight: 700; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); }
.step + .step::before { content: ""; width: 26px; height: 2px; background: var(--line); }
.step.done i { background: var(--good); border-color: var(--good); color: var(--good-ink); }
.step.cur i { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 4px var(--accent-soft); }
.steps-label { font-size: .8rem; color: var(--muted); margin-left: 12px; }
.overview { display: grid; grid-template-columns: 1.05fr 1fr; gap: 16px; }
.timeline { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 62px 1fr; gap: 12px; padding: 7px 0; font-size: .88rem; line-height: 1.45; border-bottom: 1px dashed var(--line); }
.timeline li:last-child { border-bottom: 0; }
.timeline .t { font-family: var(--font-mono); font-size: .76rem; color: var(--accent); font-weight: 700; padding-top: 2px; }
.goals { list-style: none; padding: 0; gap: 10px; }
.goals li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: .94rem; }
.goals li::before { content: "✓"; width: 20px; height: 20px; border-radius: 6px; background: var(--good-soft); color: var(--good); display: grid; place-items: center; font-size: .72rem; font-weight: 700; margin-top: 2px; }
.lesson-part { display: grid; gap: 14px; padding-top: 6px; }
.lesson-part > h2 { display: flex; align-items: baseline; gap: 12px; }
.pnum { font-family: var(--font-mono); font-size: .9rem; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 2px 8px; flex: none; }
.lesson-part > p, .lesson-part > ul, .lesson-part > ol { max-width: 70ch; font-size: 1.02rem; line-height: 1.75; }
.activity { border: 1px solid color-mix(in srgb, var(--marker) 45%, var(--line)); background: linear-gradient(180deg, var(--marker-soft), var(--surface) 70%); }
.homework { border-left: 4px solid var(--accent); }
.pcards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; border-top: 1px solid var(--line); padding-top: 22px; }
.pc { display: grid; gap: 4px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-decoration: none; color: var(--ink); transition: border-color .15s, transform .15s; }
.pc:hover { border-color: var(--accent); transform: translateY(-1px); }
.pc span { font-size: .78rem; color: var(--muted); font-weight: 600; }
.pc b { font-size: .95rem; line-height: 1.35; }
.pc.next { text-align: right; }
.pc.empty { visibility: hidden; }

/* ---------- Cột phải ---------- */
.rail { grid-area: rail; position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow-y: auto; padding: 28px 18px 24px 4px; display: grid; gap: 22px; align-content: start; scrollbar-width: thin; }
.rail-box { display: grid; gap: 10px; }
.rail-title { font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }
.toc { display: grid; gap: 1px; border-left: 1px solid var(--line); }
.toc button { text-align: left; background: none; border: 0; border-left: 2px solid transparent; margin-left: -1px; padding: 5px 0 5px 12px; font-size: .84rem; color: var(--muted); cursor: pointer; line-height: 1.4; }
.toc button:hover { color: var(--ink); }
.toc button.on { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.rail .tool { display: grid; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.rail .tool .btn { justify-content: center; width: 100%; }
.rail .tool .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rail .tool .two .btn { padding: 8px 10px; font-size: .84rem; }
.kbd { font-size: .78rem; color: var(--muted); display: grid; gap: 6px; }

    mistakes:["Bắt đầu code khi chưa có người ký duyệt phạm vi.","Quên các bên liên quan “ẩn” như pháp chế, IT nội bộ khách hàng, đơn vị bảo mật. Họ thường xuất hiện sát ngày go-live và chặn phát hành.","Dev được lên làm PM nhưng vẫn ôm code, bỏ việc quản lý."],

  { id:3, title:"Agile & Scrum", weeks:"Tuần 5–6", test:2,
    lead:"Scrum là khung làm việc để học nhanh từ sản phẩm thật, không phải một chuỗi cuộc họp. Nguồn chuẩn duy nhất là Scrum Guide 2020 (vẫn là bản chính thức hiện hành), khoảng 14 trang và có bản tiếng Việt.",
    core:[
      "<b>Tuyên ngôn Agile</b> coi trọng hơn: con người và tương tác, phần mềm chạy được, cộng tác với khách hàng, phản hồi với thay đổi. Những thứ còn lại (quy trình, tài liệu, hợp đồng, kế hoạch) vẫn cần, chỉ được đặt sau.",
      "<b>Ba trụ cột:</b> minh bạch, thanh tra, thích ứng.",
      "<b>3 trách nhiệm:</b> Product Owner (giá trị và thứ tự Backlog), Scrum Master (hiệu quả của team), Developers (tạo ra Increment). Team thường từ 10 người trở xuống.",
      "<b>5 sự kiện</b> (giới hạn thời gian cho Sprint 1 tháng): Sprint ≤ 1 tháng · Sprint Planning ≤ 8 giờ · Daily Scrum 15 phút · Sprint Review ≤ 4 giờ · Retrospective ≤ 3 giờ.",
      "<b>3 tạo tác và cam kết:</b> Product Backlog ↔ Product Goal · Sprint Backlog ↔ Sprint Goal · Increment ↔ Definition of Done.",
      "<b>User Story:</b> “Là [vai trò], tôi muốn [hành động] để [lợi ích]”, kèm tiêu chí chấp nhận Given/When/Then. Story tốt đạt <b>INVEST</b>: Độc lập, Thương lượng được, Có giá trị, Ước lượng được, Nhỏ, Kiểm thử được.",
      "<b>Velocity</b> là số điểm team làm xong trung bình mỗi Sprint. Chỉ dùng để dự báo, không dùng để so sánh các team.",
      "<b>Kanban:</b> trực quan hóa luồng việc, giới hạn WIP, đo lead time. Hợp với team bảo trì và vận hành."
    ],
    example:"<p><b>Story:</b> “Là khách hàng, tôi muốn lưu địa chỉ giao hàng mặc định để đặt hàng nhanh hơn.”</p><p><b>Tiêu chí:</b> <i>Given</i> tôi đã đăng nhập và có 2 địa chỉ, <i>When</i> tôi đánh dấu một địa chỉ là mặc định, <i>Then</i> màn thanh toán tự điền địa chỉ đó.</p><p><b>Dự báo:</b> 3 Sprint đầu đạt 28, 32, 30 điểm (trung bình 30). Backlog còn 240 điểm → cần khoảng <b>8 Sprint (16 tuần)</b>, vượt mốc 6 tháng, nên cần bàn với PO để cắt phạm vi.</p>",
    mistakes:["Daily Scrum biến thành buổi báo cáo cho sếp.","PO vắng mặt, team tự đoán yêu cầu.","Đổi Sprint Goal giữa Sprint mà không hỏi team.","“Scrum” nhưng không có Retro, hay Retro không có hành động cải tiến nào."],
    reading:[["Scrum Guide 2020 – chọn bản Tiếng Việt","https://scrumguides.org/"],["User story và tiêu chí chấp nhận – Viblo","https://viblo.asia/p/user-story-la-gi-va-tieu-chi-chap-nhan-maGK7W8BKj2"],["Tìm hiểu Kanban trong 10 phút – Viblo","https://viblo.asia/p/tim-hieu-ve-kanban-trong-10-phut-OeVKBMzy5kW"],["Jira là gì? Hướng dẫn A–Z – ITviec","https://itviec.com/blog/jira-la-gi/"]]
  },
  { id:4, title:"Chất lượng, rủi ro, thay đổi", weeks:"Tuần 7–8", test:2,
    lead:"PM giỏi không phải người không gặp sự cố. Đó là người thấy rủi ro trước và có quy trình để mọi thay đổi đều được cân nhắc về chi phí.",
    core:[
      "<b>QA và QC:</b> QA phòng lỗi bằng quy trình (code review, coding standard, CI). QC tìm lỗi trên sản phẩm (kiểm thử). Lỗi phát hiện càng muộn, chi phí sửa càng tăng theo cấp số nhân.",
      "<b>Các cấp kiểm thử:</b> Unit → Integration → System → UAT. UAT do khách hàng thực hiện và là điều kiện để nghiệm thu.",
      "<b>Definition of Done:</b> checklist chất lượng chung cho mọi story, ví dụ code đã review, unit test ≥ 70%, không còn bug Critical, đã lên staging.",
      "<b>Quy trình rủi ro:</b> Nhận diện → Đánh giá (khả năng × ảnh hưởng) → Lập phương án ứng phó → Theo dõi hằng tuần.",
      "<b>4 cách ứng phó:</b> Tránh (đổi kế hoạch để rủi ro biến mất) · Giảm (hạ khả năng hoặc ảnh hưởng) · Chuyển giao (sang bên thứ ba qua hợp đồng, bảo hiểm) · Chấp nhận (có hoặc không kèm dự phòng).",
      "<b>Rủi ro và Issue:</b> rủi ro là việc <i>có thể</i> xảy ra; issue là việc <i>đã</i> xảy ra, cần xử lý ngay.",
      "<b>Kiểm soát thay đổi:</b> mọi yêu cầu mới đi qua Change Request: phân tích tác động (phạm vi, thời gian, chi phí, chất lượng) → người có thẩm quyền duyệt hoặc từ chối → cập nhật kế hoạch. Trong Scrum, yêu cầu mới vào Product Backlog để PO sắp xếp.",
      "<b>Escalation</b> cần thống nhất từ đầu: vấn đề gì, chờ bao lâu thì báo ai. Khi báo lên, luôn mang theo phương án đề xuất.",
      "<b>Kỹ thuật tối thiểu cho PM:</b> môi trường dev/staging/production, CI/CD, release plan, rollback, feature flag; yêu cầu bảo mật như ISO 27001, pentest."
    ],
    example:"<div class=\"tablewrap\"><table><thead><tr><th>Rủi ro</th><th>KN</th><th>AH</th><th>Điểm</th><th>Ứng phó</th></tr></thead><tbody><tr><td>Cổng thanh toán cấp sandbox trễ</td><td class=\"num\">4</td><td class=\"num\">5</td><td class=\"num\">20</td><td>Giảm: gửi hồ sơ từ tuần 1, dùng mock API để dev trước</td></tr><tr><td>Dev mobile duy nhất nghỉ việc</td><td class=\"num\">2</td><td class=\"num\">5</td><td class=\"num\">10</td><td>Giảm: pair programming, tài liệu kiến trúc</td></tr><tr><td>App bị Apple từ chối khi review</td><td class=\"num\">3</td><td class=\"num\">3</td><td class=\"num\">9</td><td>Giảm: đọc guideline, nộp sớm 2 tuần</td></tr></tbody></table></div>",
    mistakes:["Risk Register viết một lần rồi để đó, không ai cập nhật.","Nhận yêu cầu “nhỏ thôi mà” qua chat mà không đánh giá tác động. Đây là gốc của phình phạm vi.","Cắt thời gian test để kịp deadline."],
    reading:[["Phân tích và quản trị rủi ro dự án phần mềm – Viblo","https://viblo.asia/p/project-management-phan-tich-va-quan-tri-rui-ro-trong-du-an-phan-mem-5OXLAknr4Gr"],["Bàn về quản lý rủi ro trong dự án Scrum – Viblo","https://viblo.asia/p/ban-ve-quan-ly-rui-ro-trong-mot-du-an-scrum-6J3ZgPGxlmB"],["Definition of Done và Acceptance Criteria – Viblo","https://viblo.asia/p/loat-bai-ve-scrum-defiition-of-done-va-acceptance-criteria-duoi-goc-nhin-cua-blogger-nhat-maGK76zx5j2"]]
  },
  { id:5, title:"Con người & giao tiếp", weeks:"Tuần 9–10", test:3,
    lead:"PM dành khoảng 80–90% thời gian cho giao tiếp. Muốn chuyển từ dev sang PM, đây là kỹ năng phải rèn nhiều nhất.",
    core:[
      "<b>Kế hoạch giao tiếp:</b> ai cần biết gì, lúc nào, qua kênh nào, ai gửi. Ví dụ: CEO nhận báo cáo 1 trang qua email mỗi thứ Sáu; team họp Daily 9h15.",
      "<b>Báo cáo RAG:</b> Xanh là đúng kế hoạch; Vàng là có rủi ro nhưng đã có phương án; Đỏ là cần cấp trên quyết định. Đừng để một mục Vàng cứ ở mãi đó rồi bất ngờ chuyển Đỏ.",
      "<b>Tuckman:</b> Hình thành → Sóng gió → Ổn định → Hiệu quả cao → Giải tán. Đến giai đoạn “Sóng gió”, PM cần làm rõ vai trò và quy tắc làm việc.",
      "<b>Servant leadership:</b> PM hoặc SM phục vụ team, gỡ vướng và bảo vệ team khỏi bị gián đoạn, thay vì ra lệnh.",
      "<b>5 cách xử lý xung đột:</b> Hợp tác (bền vững nhất) · Thỏa hiệp · Nhường · Né tránh · Áp đặt (khi khẩn cấp).",
      "<b>Đàm phán:</b> không trả lời “không” trống trơn. Hãy đưa ra lựa chọn: “Làm được: phương án A lùi 2 tuần, B bỏ tính năng X, C thêm 1 người và 120 triệu.”",
      "<b>Khách hàng nước ngoài:</b> khách Nhật coi trọng báo cáo sớm (報連相 hō-ren-sō), tài liệu chi tiết và không để họ bất ngờ. Khách Âu Mỹ thích trực tiếp, chủ động đề xuất. Với cả hai: ghi biên bản họp và xác nhận lại bằng email.",
      "<b>Quản trị:</b> chuẩn bị họp ban chỉ đạo bằng các quyết định cần đưa ra; làm việc với PMO; quản lý nhiều dự án và nhà cung cấp theo hợp đồng, SLA."
    ],
    example:"<p>Giám đốc vận hành muốn thêm “tích điểm thành viên” ngay trong bản ra mắt. PM không từ chối mà gửi email gồm: ước lượng 45 man-day; 3 phương án (lùi ngày ra mắt / đưa vào bản 1.1 sau 6 tuần / bỏ tính năng đánh giá sản phẩm để đổi); đề xuất phương án 2; và hạn trả lời là thứ Ba để kịp Sprint Planning.</p>",
    mistakes:["Giấu tin xấu với hy vọng team sẽ “gỡ” được.","Báo cáo quá kỹ thuật cho lãnh đạo.","Giao việc mà không nói rõ kết quả mong đợi và hạn chót."],
    reading:[["Quản lí risk trong dự án (chia sẻ thực tế) – Viblo","https://viblo.asia/p/quan-li-risk-trong-du-an-RnB5pyV2KPG"],["Đề cương QLDA CNTT – ĐH Hạ Long","https://old.uhl.edu.vn/wp-content/uploads/2022/03/43.-INT3014-Quan-li-du-an-CNTT.docx"]]

  { id:6, title:"Giám sát, EVM & kết thúc", weeks:"Tuần 11–12", test:3, tool:"evm",
    lead:"EVM trả lời bằng số liệu hai câu sếp nào cũng hỏi: “Đang nhanh hay chậm?” và “Đang lỗ hay lãi?”.",
    core:[
      "<b>Ba con số gốc:</b> PV (giá trị lẽ ra phải xong đến hôm nay) · EV (giá trị đã thực sự xong) · AC (số tiền đã thực sự chi).",
      "<b>Hai chỉ số:</b> <span class=\"mono\">SPI = EV / PV</span> (dưới 1 là chậm) · <span class=\"mono\">CPI = EV / AC</span> (dưới 1 là vượt chi phí).",
      "<b>Dự báo:</b> <span class=\"mono\">EAC = BAC / CPI</span> (tổng chi phí dự kiến khi xong) · <span class=\"mono\">VAC = BAC − EAC</span> (số tiền sẽ vượt hoặc tiết kiệm).",
      "<b>Trong Agile:</b> theo dõi bằng burndown/burnup và velocity. Release burnup cho thấy cả tiến độ lẫn phạm vi phình ra.",
      "<b>Kết thúc dự án:</b> UAT đạt → ký biên bản nghiệm thu → bàn giao (source code, tài liệu, tài khoản) → bảo hành → Lessons Learned → giải phóng nhân sự → đóng hợp đồng, thanh toán đợt cuối."
    ],
    example:"<p>Cuối tháng 3: BAC = 2,4 tỷ, PV = 1,2, EV = 1,0, AC = 1,1 tỷ → SPI 0,83 (chỉ đạt 83% tiến độ), CPI 0,91, EAC ≈ 2,64 tỷ, VAC ≈ −0,24 tỷ. Dự án chuyển <b>Đỏ</b>; PM trình nhà tài trợ các phương án: cắt phạm vi, lùi ngày hoặc dùng quỹ dự phòng. Thử lại bằng máy tính EVM bên dưới.</p>",
    mistakes:["Tính EV theo cảm tính “xong 80%”. Nên dùng quy tắc 0/100 hoặc 50/50.","“Đóng” dự án mà không có biên bản nghiệm thu, nên khách tiếp tục đòi sửa miễn phí.","Bỏ qua Lessons Learned, nên dự án sau lặp lại đúng lỗi cũ."],
    reading:[["Chứng chỉ PMP A–Z – ITviec","https://itviec.com/blog/chung-chi-pmp-la-gi/"],["Chứng chỉ PSM là gì – ITviec","https://itviec.com/blog/chung-chi-professional-scrum-master-la-gi/"]]
  },
  { id:7, title:"AI trong quản lý dự án", weeks:"Tuần 13", test:4,
    lead:"Nhà tuyển dụng năm 2026 không hỏi “bạn có dùng AI không” mà hỏi “bạn dùng AI thế nào cho an toàn và hiệu quả”. Module này dạy cả hai phía: dùng AI làm trợ lý cho PM, và quản lý dự án có tính năng AI.",
    core:[
      "<b>AI tạo sinh là trợ lý soạn thảo và phân tích</b>, không phải người chịu trách nhiệm. Nó đưa bạn từ trang trắng đến bản nháp 70%; phần còn lại là việc của PM.",
      "<b>Prompt 5 phần:</b> Vai trò · Bối cảnh · Nhiệm vụ · Định dạng · Ràng buộc. Thêm “hỏi tôi trước khi viết” và “ghi rõ giả định”.",
      "<b>Người duyệt cuối (human-in-the-loop):</b> soát 4 điểm trước khi gửi: số liệu, tên và vai trò, cam kết, dữ liệu nhạy cảm.",
      "<b>Rủi ro khi dùng AI:</b> lộ dữ liệu, ảo giác (hallucination), bản quyền code theo hợp đồng, lỗ hổng bảo mật, phụ thuộc. Đưa vào Risk Register.",
      "<b>Pháp lý 2026:</b> Luật Bảo vệ dữ liệu cá nhân 2025 + Nghị định 356/2025 (hiệu lực 1/1/2026); Luật Trí tuệ nhân tạo 134/2025/QH15 (hiệu lực 1/3/2026).",
      "<b>Chính sách AI 1 trang của team:</b> công cụ được phép, dữ liệu Xanh/Vàng/Đỏ, trách nhiệm, minh bạch, bổ sung DoD, đo lường tác động thật.",
      "<b>Dự án có tính năng AI:</b> phụ thuộc dữ liệu, kết quả xác suất, khó ước lượng → PoC có timebox, tiêu chí nghiệm thu dạng ngưỡng, giám sát drift và chi phí API sau go-live. PMI dùng phương pháp CPMAI 6 giai đoạn."
    ],
    example:"<p>Chị Lan muốn thêm “gợi ý sản phẩm bằng AI” trước go-live. PM không trả lời có hay không ngay, mà hỏi về dữ liệu lịch sử mua và sự đồng ý của khách, rồi đề xuất: giai đoạn 1 làm gợi ý theo quy tắc (“thường mua kèm”, khoảng 8 man-day); chạy PoC AI 2 tuần sau go-live với tiêu chí ≥ 70% gợi ý được đánh giá liên quan. Anh Minh chọn phương án, mốc 1/7 được giữ.</p>",
    mistakes:["Gửi thẳng báo cáo do AI soạn, trong đó có số liệu sai hoặc cam kết chưa ai đồng ý.","Dán dữ liệu khách hàng, giá hợp đồng hoặc API key vào chatbot miễn phí.","Tăng velocity kỳ vọng ngay khi team bắt đầu dùng AI, trước khi đo được tác động thật.","Ký Fixed Price cho tính năng AI chưa qua PoC."],
    reading:[["Luật Trí tuệ nhân tạo 2025 – Thư viện Pháp luật","https://thuvienphapluat.vn/van-ban/Cong-nghe-thong-tin/Luat-Tri-tue-nhan-tao-2025-so-134-2025-QH15-679013.aspx"],["Toàn văn Nghị định 356/2025 hướng dẫn Luật Bảo vệ dữ liệu cá nhân","https://thuvienphapluat.vn/phap-luat-nha-dat/toan-van-nghi-dinh-3562025ndcp-huong-dan-luat-bao-ve-du-lieu-ca-nhan-13670.html"],["PMI – AI in Project Management (tiếng Anh)","https://www.pmi.org/ai"]]

const KEY = "qlda-progress-v1";
let P = { s:{}, e:{}, t:{} };
try { const raw = localStorage.getItem(KEY); if (raw) P = Object.assign(P, JSON.parse(raw)); } catch (e) {}
const COURSE_SLUG = "qlda-cntt";
const ACC = document.createElement("div"); ACC.id = "account-slot"; ACC.style.padding = "0 8px";
let accMounted = false;
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} if (window.Platform) Platform.saveProgress(COURSE_SLUG, P); }
function mergeProgress(r) {
  if (!r) return;
  ["s","e"].forEach(k => Object.entries(r[k] || {}).forEach(([id,v]) => { if (v) P[k][id] = true; }));
  Object.entries(r.t || {}).forEach(([id,v]) => { if (P.t[id] == null || v > P.t[id]) P.t[id] = v; });
}

/* ===================== TIỆN ÍCH ===================== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const fmt = (n, d=2) => Number.isFinite(n) ? n.toLocaleString("vi-VN",{minimumFractionDigits:d, maximumFractionDigits:d}) : "–";
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 1800); }
function sessionsOf(m) { return SESSIONS.filter(s => s[1] === m); }
function modProgress(m) {
  const ss = sessionsOf(m), ex = EXERCISES[m];
  const total = ss.length + ex.length;
  const done = ss.filter(s => P.s[s[0]]).length + ex.filter(x => P.e[x[0]]).length;
  return { done, total };
}
function overall() {
  const sd = SESSIONS.filter(s => P.s[s[0]]).length;
  const all = Object.values(EXERCISES).flat();
  const ed = all.filter(x => P.e[x[0]]).length;
  const tp = Object.keys(TESTS).filter(k => (P.t[k] ?? -1) >= 7).length;
  return { sd, st: SESSIONS.length, ed, et: all.length, tp, tt: Object.keys(TESTS).length };
}
function statusPill(done, total) {
  if (done === 0) return `<span class="pill">Chưa bắt đầu</span>`;
  if (done >= total) return `<span class="pill done">Hoàn thành</span>`;
  return `<span class="pill part">${done}/${total}</span>`;
}

  const h = (location.hash || "#home").slice(1);
  const cur = currentLesson();
  const curMod = cur ? SESSIONS[cur-1][1] : (/^m[1-7]$/.test(h) ? +h[1] : null);
  if (curMod) OPEN_MODS.add(curMod);
  const o = overall();
  const pct = Math.round((o.sd + o.ed) / (o.st + o.et) * 100);
  const link = (id, label, tag) => `<a href="#${id}" class="nv ${id===active && !cur ? "active" : ""}" ${id===active && !cur ? 'aria-current="page"' : ""}><span>${esc(label)}</span>${tag ? `<span class="tag">${esc(tag)}</span>` : ""}</a>`;
  const mods = MODULES.map(m => {
    const ss = sessionsOf(m.id), done = ss.filter(s => P.s[s[0]]).length, open = OPEN_MODS.has(m.id);
    return `<div class="mod ${open ? "open" : ""}">
      <button class="mod-head" data-tmod="${m.id}" aria-expanded="${open}"><span class="mod-code">M${m.id}</span><span class="mod-name">${esc(m.title.split(":")[0])}</span><span class="mod-meta">${done}/${ss.length}${ICON.chev}</span></button>
      <div class="mod-body">
        <a href="#m${m.id}" class="ses ov ${h === "m"+m.id ? "cur" : ""}"><span></span><span>Tổng quan module · ${esc(m.weeks)}</span></a>
        ${ss.map(s => `<a href="#b${s[0]}" class="ses ${P.s[s[0]] ? "done" : ""} ${cur === s[0] ? "cur" : ""}" ${cur === s[0] ? 'aria-current="page"' : ""}><span class="dot">${P.s[s[0]] ? "✓" : s[0]}</span><span>${esc(s[3])}</span></a>`).join("")}
      </div></div>`;
  }).join("");
  const PRACTICE = ["bai-tap","tinh-huong","capstone","test-1","test-2","test-3","test-4"];
  const DOCS = ["dap-an","dap-an-capstone","cheat-sheet","phong-van","ho-so","bieu-mau","thuat-ngu"];
  const auto = (PRACTICE.includes(active) || h === "capstone") ? "practice" : (DOCS.includes(active) || /^dap-an/.test(h)) ? "docs" : "learn";
  if (SIDE_TAB.route !== h) { SIDE_TAB.tab = auto; SIDE_TAB.route = h; }
  const tab = SIDE_TAB.tab;
  const exDone = Object.values(EXERCISES).flat().filter(x => P.e[x[0]]).length, exAll = Object.values(EXERCISES).flat().length;
  const item = (id, label, sub, right) => `<a href="#${id}" class="nv tall ${id===active && !cur ? "active" : ""}" ${id===active && !cur ? 'aria-current="page"' : ""}><span class="nvt"><span>${esc(label)}</span>${sub ? `<small>${esc(sub)}</small>` : ""}</span>${right ? `<span class="tag">${esc(right)}</span>` : ""}</a>`;
  const testChip = k => { const sc = P.t[k], on = active === "test-"+k; return `<a href="#test-${k}" class="tchip ${on ? "on" : ""} ${sc != null ? (sc >= 7 ? "pass" : "fail") : ""}"><b>Test ${k}</b><span>${sc != null ? sc + "/10" : ({1:"M1–2",2:"M3–4",3:"M5–6",4:"M7 · AI"})[k]}</span></a>`; };
  const panels = {
    learn: `<div class="nvgroup">${link("home","Tổng quan")}${link("lo-trinh","Lộ trình 26 buổi")}</div>
      <div class="nvgroup"><div class="nvlabel">7 module · 26 buổi</div>${mods}</div>`,
    practice: `<div class="nvgroup"><div class="nvlabel">Thực hành</div>
        ${item("bai-tap","Bài tập theo module", exDone + "/" + exAll + " bài đã làm")}
        ${item("tinh-huong","6 tình huống thực tế","Tự xử lý rồi xem gợi ý")}
        ${item("capstone","Capstone: Cứu dự án FreshGo","Bài cuối khóa · 30% điểm")}</div>
      <div class="nvgroup"><div class="nvlabel">Kiểm tra · đạt từ 7/10</div><div class="tchips">${["1","2","3","4"].map(testChip).join("")}</div></div>`,
    docs: `<div class="nvgroup"><div class="nvlabel">Đáp án</div>${item("dap-an","Đáp án bài tập","M1–M7, có tiêu chí tự chấm")}${item("dap-an-capstone","Đáp án Capstone","Lời giải và memo mẫu")}</div>
      <div class="nvgroup"><div class="nvlabel">Sẵn sàng đi làm</div>${item("phong-van","Phỏng vấn","Câu hỏi và gợi ý trả lời")}${item("ho-so","CV & Portfolio","CV, portfolio, 30-60-90")}</div>
      <div class="nvgroup"><div class="nvlabel">Công cụ</div>${item("cheat-sheet","Cheat sheet","Công thức trên 1 trang")}${item("bieu-mau","Biểu mẫu","10 mẫu dùng ngay")}${item("thuat-ngu","Thuật ngữ","Anh – Việt")}</div>`
  };
  const tabBtn = (k, label) => `<button role="tab" class="stab ${tab===k ? "on" : ""}" aria-selected="${tab===k}" data-stab="${k}">${label}</button>`;
  $("#nav").innerHTML = `
    <div class="course-card"><div class="t">Quản lý dự án CNTT thực chiến</div><div class="s">${o.sd}/${o.st} buổi · ${o.ed}/${o.et} bài tập · ${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div></div>

    <div class="spanel-nav" role="tabpanel">${panels[tab]}</div>`;
}

function toolPert() {
  return `<section class="card calc" id="pert"><h3>Máy tính ước lượng ba điểm (PERT)</h3>
  <div class="fields">
    <label for="po">Lạc quan (O)<input id="po" type="number" min="0" step="0.5" value="10"></label>
    <label for="pm">Khả năng cao nhất (M)<input id="pm" type="number" min="0" step="0.5" value="15"></label>
    <label for="pp">Bi quan (P)<input id="pp" type="number" min="0" step="0.5" value="32"></label>
  </div>
  <div class="results" id="pert-out"></div></section>`;
}
function calcPert() {
  const o = +$("#po").value, m = +$("#pm").value, p = +$("#pp").value;
  const e = (o + 4*m + p) / 6, sd = (p - o) / 6;
  $("#pert-out").innerHTML = `<div class="res"><b>${fmt(e,1)}</b><span>Ước lượng E (man-day)</span></div><div class="res"><b>${fmt(sd,1)}</b><span>Độ lệch chuẩn (P − O) / 6</span></div><div class="res"><b>${fmt(e+2*sd,1)}</b><span>Mức an toàn ~95% (E + 2σ)</span></div>`;
}

    <label for="ev">EV<input id="ev" type="number" step="0.01" value="1.0"></label>
    <label for="ac">AC<input id="ac" type="number" step="0.01" value="1.1"></label>
  </div>

}
function calcEvm() {
  const bac=+$("#bac").value, pv=+$("#pv").value, ev=+$("#ev").value, ac=+$("#ac").value;
  const spi = ev/pv, cpi = ev/ac, eac = bac/cpi, vac = bac - eac;
  const cls = v => v < 1 ? "badv" : "goodv";
  $("#evm-out").innerHTML = `<div class="res ${cls(spi)}"><b>${fmt(spi)}</b><span>SPI = EV / PV</span></div><div class="res ${cls(cpi)}"><b>${fmt(cpi)}</b><span>CPI = EV / AC</span></div><div class="res"><b>${fmt(eac)}</b><span>EAC = BAC / CPI</span></div><div class="res ${vac<0?"badv":"goodv"}"><b>${fmt(vac)}</b><span>VAC = BAC − EAC</span></div>`;
  let say = "";
  if (Number.isFinite(spi) && Number.isFinite(cpi)) {
    const s = spi < 0.9 || cpi < 0.9 ? ["fail","Đỏ"] : (spi < 1 || cpi < 1 ? ["part","Vàng"] : ["pass","Xanh"]);
    say = `Trạng thái gợi ý: <span class="verdict ${s[0]==="part"?"":s[0]}" style="${s[0]==="part"?"background:var(--marker-soft);color:var(--marker)":""}">${s[1]}</span> · ${spi<1?"chậm tiến độ":"đúng/nhanh tiến độ"}, ${cpi<1?"đang vượt chi phí":"trong ngân sách"}.`;
  }
  $("#evm-say").innerHTML = say;
}

function bindQuiz() {
  const f = $("#quiz"); if (!f) return;
  const n = f.dataset.n, T = TESTS[n];
  const count = () => { const c = T.q.filter((_,i) => f.querySelector(`input[name=q${i}]:checked`)).length; $("#answered").textContent = `Đã chọn ${c}/10 câu`; };
  f.addEventListener("change", count);
  f.addEventListener("submit", e => {
    e.preventDefault();
    let sc = 0;
    T.q.forEach((q,i) => {
      const pick = f.querySelector(`input[name=q${i}]:checked`);
      const v = pick ? +pick.value : -1;
      q[1].forEach((_,j) => { const el = $(`#o-${i}-${j}`); el.classList.remove("correct","wrong"); if (j===q[2]) el.classList.add("correct"); else if (j===v) el.classList.add("wrong"); });
      if (v === q[2]) sc++;
      const x = $(`#x-${i}`); x.hidden = false;
      x.innerHTML = `<b>${v===q[2]?"Đúng.":(v<0?"Chưa trả lời.":"Chưa đúng.")}</b> Đáp án ${"ABCD"[q[2]]}. ${esc(q[3])}`;
    });
    P.t[n] = sc; save(); renderNav("test-"+n);
    const pass = sc >= 7;
    $("#score").innerHTML = `<span class="big">${sc}/10</span><span class="verdict ${pass?"pass":"fail"}">${pass?"Đạt":"Chưa đạt"}</span><span class="lead">${pass?"Tốt lắm. Xem lại giải thích các câu sai rồi học tiếp.":"Đọc lại phần Ý cốt lõi của module rồi làm lại nhé."}</span>`;
    $("#score").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"});
  });
  $("#reset").addEventListener("click", () => { route(); window.scrollTo(0,0); });
}

function route() {
  const h = (location.hash || "#home").slice(1);
  let html, active = h;
  if (h === "lo-trinh") html = pageRoadmap();
  else if (/^m[1-7]$/.test(h)) html = pageModule(+h[1]);
  else if (/^b([1-9]|1[0-9]|2[0-6])$/.test(h)) { const n = +h.slice(1); html = pageLesson(n); active = "m" + SESSIONS[n-1][1]; }
  else if (h === "bai-tap") html = pageExercises();
  else if (h === "tinh-huong") html = pageCases();
  else if (h === "capstone") html = pageCapstone();
  else if (/^test-[1-4]$/.test(h)) html = pageTest(h.slice(5));
  else if (h === "bieu-mau") html = pageTemplates();
  else if (h === "thuat-ngu") html = pageGlossary();
  else if (h === "dap-an") html = pageAnswerHub();
  else if (/^dap-an-[1-7]$/.test(h)) { html = pageAnswerModule(+h.slice(7)); active = "dap-an"; }
  else if (h === "dap-an-capstone") html = pageCapstoneAnswer();
  else if (h === "phong-van") html = pageInterview();
  else if (h === "ho-so") html = pageCareer();
  else if (h === "cheat-sheet") html = pageCheat();
  else { html = pageHome(); active = "home"; }
  $("#view").innerHTML = html;
  renderNav(active);
  renderChrome(h);
  if (window.Platform) { if (!accMounted) { Platform.mountAccount(ACC); accMounted = true; } const d = $("#discuss"); if (d) Platform.mountComments(d, COURSE_SLUG, d.dataset.key); }
  if ($("#pert")) { calcPert(); $("#pert").addEventListener("input", calcPert); }
  if ($("#evm")) { calcEvm(); $("#evm").addEventListener("input", calcEvm); }
  bindQuiz();
  const gq = $("#gq");
  if (gq) gq.addEventListener("input", () => { const q = gq.value.trim().toLowerCase(); $("#gbody").innerHTML = GLOSSARY.filter(g => g.join(" ").toLowerCase().includes(q)).map(g=>`<tr><td><b>${esc(g[0])}</b></td><td>${esc(g[1])}</td><td>${esc(g[2])}</td></tr>`).join("") || `<tr><td colspan="3">Không tìm thấy “${esc(gq.value)}”. Thử từ khác.</td></tr>`; });
}

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.s) { P.s[t.dataset.s] = t.checked; save(); t.closest(".check").classList.toggle("is-done", t.checked); renderNav((location.hash||"#home").slice(1)); renderTop((location.hash||"#home").slice(1)); }
  if (t.dataset && t.dataset.e) { P.e[t.dataset.e] = t.checked; save(); t.closest(".check").classList.toggle("is-done", t.checked); }
});
document.addEventListener("click", async e => {
  const pb = e.target.closest("[data-pdf]");
  if (pb) { savePdf(pb); return; }
  const md = e.target.closest(".js-done");
  if (md) { const n = md.dataset.n; P.s[n] = !P.s[n]; save();
    document.querySelectorAll(".js-done").forEach(b => { b.classList.toggle("is-done", !!P.s[n]); b.textContent = P.s[n] ? (b.closest(".rail") ? "✓ Đã học xong" : "✓ Đã học xong buổi này") : "Đánh dấu đã học xong"; });
    const h = (location.hash||"#home").slice(1); renderNav(h); renderTop(h);
    toast(P.s[n] ? "Đã lưu: xong buổi " + n : "Đã bỏ đánh dấu buổi " + n); return; }
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const t = TEMPLATES.find(x => x.id === b.dataset.copy);
  const tsv = [t.h, ...t.r].map(r => r.join("\t")).join("\n");
  try { await navigator.clipboard.writeText(tsv); toast("Đã sao chép " + t.t.split("·")[1].trim()); }
  catch (err) { toast("Trình duyệt chặn sao chép. Hãy bôi đen bảng rồi Ctrl+C."); }
});
/* ===================== KHUNG GIAO DIỆN: thanh trên, cột phải, chế độ ===================== */
const PAGE_LABEL = { "home":"Tổng quan", "lo-trinh":"Lộ trình 26 buổi", "bai-tap":"Bài tập", "tinh-huong":"6 tình huống", "capstone":"Capstone", "test-1":"Test 1", "test-2":"Test 2", "test-3":"Test 3", "test-4":"Test 4", "bieu-mau":"Biểu mẫu", "thuat-ngu":"Thuật ngữ", "dap-an":"Đáp án bài tập", "dap-an-capstone":"Đáp án Capstone", "cheat-sheet":"Cheat sheet", "phong-van":"Phỏng vấn", "ho-so":"CV & Portfolio" };
const PREF_KEY = "qlda-ui-v1";
let UI = { theme: null, focus: false, noside: false };
try { UI = Object.assign(UI, JSON.parse(localStorage.getItem(PREF_KEY) || "{}")); } catch (e) {}
function saveUI() { try { localStorage.setItem(PREF_KEY, JSON.stringify(UI)); } catch (e) {} }
const isNarrow = () => matchMedia("(max-width: 1023px)").matches;
function applyUI() {
  const root = document.documentElement;
  if (UI.theme) root.setAttribute("data-theme", UI.theme); else root.removeAttribute("data-theme");
  const sh = $("#shell");
  sh.classList.toggle("focus", !!UI.focus);
  sh.classList.toggle("noside", !!UI.noside && !isNarrow());
  $("#tg-focus").setAttribute("aria-pressed", String(!!UI.focus));
}
function currentTheme() { return UI.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }

function renderTop(h) {
  const o = overall(), pct = Math.round((o.sd + o.ed) / (o.st + o.et) * 100);
  let crumbs = `<a href="#home" class="hide-sm">Quản lý dự án CNTT</a>`;
  const n = currentLesson();
  if (n) { const s = SESSIONS[n-1]; crumbs += `<span class="sep hide-sm">/</span><a href="#m${s[1]}" class="hide-sm">Module ${s[1]}</a><span class="sep">/</span><b>Buổi ${n}: ${esc(s[3])}</b>`; }
  else if (/^m[1-7]$/.test(h)) { const m = MODULES.find(x => x.id === +h[1]); crumbs += `<span class="sep hide-sm">/</span><b>Module ${m.id}: ${esc(m.title.split(":")[0])}</b>`; }
  else if (/^dap-an-[1-7]$/.test(h)) crumbs += `<span class="sep hide-sm">/</span><a href="#dap-an" class="hide-sm">Đáp án</a><span class="sep">/</span><b>Module ${h.slice(7)}</b>`;
  else crumbs += `<span class="sep hide-sm">/</span><b>${esc(PAGE_LABEL[h] || "Tổng quan")}</b>`;
  $("#crumbs").innerHTML = crumbs;
  $("#cprog").innerHTML = `<span class="ring" style="--p:${pct}" aria-hidden="true"></span><span><b>${pct}%</b> <span class="txt">hoàn thành</span></span>`;
  $("#cprog").title = `${o.sd}/${o.st} buổi · ${o.ed}/${o.et} bài tập · ${o.tp}/${o.tt} test đạt`;
}

let tocObserver = null;
function renderRail(h) {
  const view = $("#view");
  const heads = [...view.querySelectorAll("h2, [data-toc]")].filter(el => !el.closest("details") && !el.closest(".card:not([data-toc])"));
  heads.forEach((el, i) => { if (!el.id) el.id = "sec-" + i; });
  const label = el => el.dataset.toc || el.dataset.tocLabel || el.textContent.trim();
  const n = currentLesson();
  let tools = "";
  if (n) {
    const s = SESSIONS[n-1], done = !!P.s[n], fname = `QLDA-CNTT_Buoi-${String(n).padStart(2,"0")}.pdf`;
    tools = `<div class="rail-box"><div class="rail-title">Buổi ${n} / ${SESSIONS.length}</div><div class="tool">
      <button class="btn js-done ${done ? "is-done" : ""}" data-n="${n}">${done ? "✓ Đã học xong" : "Đánh dấu đã học xong"}</button>
      <div class="two"><button class="btn ghost" data-pdf="${PDF_IDS[n-1]}" data-name="${fname}">Tải PDF</button><a class="btn ghost" href="${pdfUrl(PDF_IDS[n-1])}" target="_blank" rel="noopener">Mở PDF</a></div>
      <div class="two">${n > 1 ? `<a class="btn ghost" href="#b${n-1}" title="Phím ←">← Trước</a>` : `<span></span>`}${n < SESSIONS.length ? `<a class="btn ghost" href="#b${n+1}" title="Phím →">Sau →</a>` : `<a class="btn ghost" href="#capstone">Capstone</a>`}</div>
    </div></div>`;
  }
  if (!n) {
    const nx = SESSIONS.find(s => !P.s[s[0]]);
    tools = nx ? `<div class="rail-box"><div class="rail-title">Học tiếp</div><div class="tool"><span style="font-size:.86rem;line-height:1.4"><b>Buổi ${nx[0]}:</b> ${esc(nx[3])}</span><a class="btn" href="#b${nx[0]}">Vào học →</a></div></div>` : "";
  }
  const toc = heads.length >= 2 ? `<div class="rail-box"><div class="rail-title">Trong trang này</div><nav class="toc">${heads.map(el => `<button data-goto="${el.id}">${esc(label(el))}</button>`).join("")}</nav></div>` : "";
  const keys = `<div class="rail-box kbd"><div class="rail-title">Phím tắt</div><span><kbd>←</kbd> <kbd>→</kbd> chuyển buổi học</span><span><kbd>F</kbd> chế độ tập trung</span><span><kbd>[</kbd> ẩn/hiện mục lục</span><span><kbd>Ctrl K</kbd> tìm kiếm</span></div>`;
  $("#rail").innerHTML = tools + toc + keys;
  if (tocObserver) tocObserver.disconnect();
  if (heads.length >= 2 && "IntersectionObserver" in window) {
    tocObserver = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) { $("#rail").querySelectorAll(".toc button").forEach(b => b.classList.toggle("on", b.dataset.goto === en.target.id)); } });
    }, { rootMargin: "-80px 0px -70% 0px" });
    heads.forEach(el => tocObserver.observe(el));
  }
}

function renderChrome(h) {
  renderTop(h);
  renderRail(h);
  if (typeof ACC !== "undefined" && ACC && !ACC.isConnected) $("#account-top").appendChild(ACC);
  $("#shell").classList.remove("side-open");
  const nav = $("#nav"), cur = $("#nav .ses.cur, #nav .nv.active");
  if (cur && !isNarrow()) { const r = cur.getBoundingClientRect(), nr = nav.getBoundingClientRect(); if (r.top < nr.top || r.bottom > nr.bottom) nav.scrollTop += r.top - nr.top - nr.height / 3; }
}

/* Sự kiện giao diện */
document.addEventListener("click", e => {
  const tm = e.target.closest("[data-tmod]");
  if (tm) { const id = +tm.dataset.tmod; OPEN_MODS.has(id) ? OPEN_MODS.delete(id) : OPEN_MODS.add(id); const mod = tm.closest(".mod"); mod.classList.toggle("open"); tm.setAttribute("aria-expanded", String(mod.classList.contains("open"))); return; }
  const st = e.target.closest("[data-stab]");
  if (st) { SIDE_TAB.tab = st.dataset.stab; const h = (location.hash || "#home").slice(1); SIDE_TAB.route = h; renderNav(h); $("#nav").scrollTop = 0; return; }
  const go = e.target.closest("[data-goto]");
  if (go) { const el = document.getElementById(go.dataset.goto); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); return; }
  if (e.target.closest("#tg-side")) { if (isNarrow()) $("#shell").classList.toggle("side-open"); else { UI.noside = !UI.noside; if (UI.noside) UI.focus = false; saveUI(); applyUI(); } return; }
  if (e.target.closest("#tg-focus")) { UI.focus = !UI.focus; saveUI(); applyUI(); toast(UI.focus ? "Chế độ tập trung: bật (phím F để tắt)" : "Chế độ tập trung: tắt"); return; }
  if (e.target.closest("#tg-theme")) { UI.theme = currentTheme() === "dark" ? "light" : "dark"; saveUI(); applyUI(); return; }
  if (e.target.closest("#scrim")) { $("#shell").classList.remove("side-open"); return; }
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  const n = currentLesson();
  if (e.key === "ArrowRight" && n) { location.hash = n < SESSIONS.length ? "#b" + (n + 1) : "#capstone"; }
  else if (e.key === "ArrowLeft" && n && n > 1) { location.hash = "#b" + (n - 1); }
  else if (e.key === "f" || e.key === "F") { UI.focus = !UI.focus; saveUI(); applyUI(); }
  else if (e.key === "[") { if (isNarrow()) $("#shell").classList.toggle("side-open"); else { UI.noside = !UI.noside; saveUI(); applyUI(); } }
  else if (e.key === "Escape") { $("#shell").classList.remove("side-open"); if (UI.focus) { UI.focus = false; saveUI(); applyUI(); } }
});
matchMedia("(max-width: 1023px)").addEventListener("change", applyUI);
applyUI();

/* ===================== TÌM KIẾM (Ctrl K hoặc /) ===================== */
let SINDEX = null, sHits = [], sSel = 0;
const strip = h => String(h).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
const fold = t => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d");
function buildIndex() {
  const ix = [];
  Object.entries(PAGE_LABEL).forEach(([h, l]) => ix.push({ h, kind: "Trang", title: l, text: "" }));
  MODULES.forEach(m => ix.push({ h: "m" + m.id, kind: "Module " + m.id, title: m.title, text: strip(m.lead + " " + m.core.join(" ")) }));
  SESSIONS.forEach(s => {
    const L = (window.LESSONS || {})[s[0]];
    ix.push({ h: "b" + s[0], kind: "Buổi " + s[0], title: s[3], text: L ? strip(L.goals.join(" ") + " " + L.parts.map(p => p.h + " " + p.html).join(" ")) : "" });
    if (L) L.parts.forEach(p => ix.push({ h: "b" + s[0], kind: "Buổi " + s[0] + " · mục", title: p.h.replace(/^\d+\.\s*/, ""), text: strip(p.html) }));
  });
  (typeof GLOSSARY !== "undefined" ? GLOSSARY : []).forEach(g => ix.push({ h: "thuat-ngu", kind: "Thuật ngữ", title: g[0] + " — " + g[1], text: g[2] }));
  (typeof TEMPLATES !== "undefined" ? TEMPLATES : []).forEach(t => ix.push({ h: "bieu-mau", kind: "Biểu mẫu", title: t.t, text: t.note }));
  ix.forEach(x => { x.ft = fold(x.title); x.fx = fold(x.text); });
  return ix;
}
function searchRun(q) {
  const terms = fold(q).split(/\s+/).filter(Boolean);
  if (!terms.length) { sHits = SESSIONS.filter(s => !P.s[s[0]]).slice(0, 6).map(s => ({ h: "b" + s[0], kind: "Gợi ý · Buổi " + s[0], title: s[3] })); }
  else {
    sHits = SINDEX.map(x => {
      let sc = 0;
      for (const t of terms) { if (x.ft.includes(t)) sc += 10; else if (x.fx.includes(t)) sc += 2; else return null; }
      if (x.ft.startsWith(terms[0])) sc += 5;
      return { x, sc };
    }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 30).map(r => r.x);
  }
  sSel = 0; drawHits(q);
}
function drawHits(q) {
  const box = $("#sres");
  box.innerHTML = sHits.length ? sHits.map((x, i) => `<a class="shit ${i === sSel ? "sel" : ""}" href="#${x.h}" data-i="${i}"><small>${esc(x.kind)}</small><span>${esc(x.title)}</span></a>`).join("") : `<div class="sempty">Không tìm thấy “${esc(q)}”. Thử từ khác, ví dụ: rủi ro, EVM, user story.</div>`;
  const sel = box.querySelector(".sel"); if (sel) sel.scrollIntoView({ block: "nearest" });
}
function openSearch() {
  if (!SINDEX) SINDEX = buildIndex();
  $("#sbox").classList.add("open"); const i = $("#sinput"); i.value = ""; searchRun(""); setTimeout(() => i.focus(), 10);
}
function closeSearch() { $("#sbox").classList.remove("open"); }
document.addEventListener("click", e => {
  if (e.target.closest("#tg-search")) { openSearch(); return; }
  if (e.target.id === "sbox") { closeSearch(); return; }
  if (e.target.closest(".shit")) { closeSearch(); }
});
document.addEventListener("keydown", e => {
  const open = $("#sbox").classList.contains("open");
  if ((e.key === "k" || e.key === "K") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); open ? closeSearch() : openSearch(); return; }
  if (!open && e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && !e.target.isContentEditable) { e.preventDefault(); openSearch(); return; }
  if (!open) return;
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeSearch(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); sSel = Math.min(sSel + 1, sHits.length - 1); drawHits($("#sinput").value); }
  else if (e.key === "ArrowUp") { e.preventDefault(); sSel = Math.max(sSel - 1, 0); drawHits($("#sinput").value); }
  else if (e.key === "Enter" && sHits[sSel]) { e.preventDefault(); location.hash = "#" + sHits[sSel].h; closeSearch(); }
}, true);
document.addEventListener("input", e => { if (e.target.id === "sinput") searchRun(e.target.value); });

if ('../../index.html') { const lg = $("#logo"); lg.href = '../../index.html'; lg.title = "Tất cả khóa học"; }
window.addEventListener("hashchange", () => { route(); window.scrollTo(0,0); $("#view").focus({preventScroll:true}); });
route();
if (window.Platform) {
  const sync = async () => { const r = await Platform.loadProgress(COURSE_SLUG); if (Platform.user) { mergeProgress(r); save(); route(); } };
  Platform.ready.then(sync); Platform.onAuthChange(sync);
}
</script>
