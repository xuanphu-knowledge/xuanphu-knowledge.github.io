<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cộng đồng Học Quản lý dự án</title>
<meta name="description" content="Khóa học miễn phí, thực chiến, bằng tiếng Việt cho người làm CNTT.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: thanh trên · hero 2 cột (giới thiệu + "Học tiếp") · lưới thẻ khóa học · giới thiệu cộng đồng */
:root {
  --paper:#f5f6f8; --surface:#ffffff; --sunken:#eef0f4; --ink:#121826; --muted:#5b6474; --line:#e2e5eb;
  --accent:#2f4fd8; --accent-ink:#ffffff; --accent-soft:#eef1fd; --marker:#b45309; --marker-soft:#fdf3e4;
  --good:#15803d; --good-soft:#e6f4ea; --bad:#c0262d; --bad-soft:#fdecec;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --font-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper:#0d1117; --surface:#151b24; --sunken:#10151d; --ink:#e6e9ef; --muted:#98a2b3; --line:#252d39;
  --accent:#8fa3ff; --accent-ink:#0d1117; --accent-soft:#1b2340; --marker:#f2a65a; --marker-soft:#33240f;
  --good:#6dd28f; --good-soft:#14291c; --bad:#ff8a8a; --bad-soft:#3a1a1c; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper:#0d1117; --surface:#151b24; --sunken:#10151d; --ink:#e6e9ef; --muted:#98a2b3; --line:#252d39;
  --accent:#8fa3ff; --accent-ink:#0d1117; --accent-soft:#1b2340; --marker:#f2a65a; --marker-soft:#33240f;
  --good:#6dd28f; --good-soft:#14291c; --bad:#ff8a8a; --bad-soft:#3a1a1c; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; height: 62px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; text-decoration: none; color: var(--ink); min-width: 0; }
.brand span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logo { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-mono); font-size: .76rem; flex: none; }
.right { display: flex; align-items: center; gap: 8px; }
.iconbtn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; border: 0; background: transparent; cursor: pointer; color: var(--muted); }
.iconbtn:hover { background: var(--sunken); color: var(--ink); }
.hero { padding: 56px 0 40px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 40px; align-items: center; }
.hero h1 { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.1; margin: 0 0 14px; letter-spacing: -.02em; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); max-width: 56ch; font-size: 1.08rem; }
.eyebrow { font-size: .76rem; color: var(--marker); font-weight: 700; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 12px; }
.facts { display: flex; gap: 28px; margin-top: 26px; flex-wrap: wrap; }
.facts div { display: grid; }
.facts b { font-family: var(--font-mono); font-size: 1.5rem; }
.facts span { font-size: .84rem; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: 0 12px 40px rgba(16,24,40,.08); display: grid; gap: 14px; }
.panel .k { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.panel h2 { margin: 0; font-size: 1.25rem; line-height: 1.3; }
.panel p { margin: 0; color: var(--muted); font-size: .94rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 11px 18px; border-radius: 11px; font-weight: 700; text-decoration: none; }
.btn:hover { filter: brightness(1.07); }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin: 10px 0 18px; }
.section-head h2 { margin: 0; font-size: 1.4rem; }
.section-head span { color: var(--muted); font-size: .9rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding-bottom: 44px; }
.course { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; text-decoration: none; color: var(--ink); box-shadow: var(--shadow); transition: transform .15s, border-color .15s, box-shadow .15s; }
a.course:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 14px 34px rgba(16,24,40,.1); }
.cover { height: 128px; background: var(--accent); position: relative; overflow: hidden; display: flex; align-items: flex-end; padding: 16px 18px; color: var(--accent-ink); }
.cover::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(color-mix(in srgb, var(--accent-ink) 14%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--accent-ink) 14%, transparent) 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(135deg, transparent 20%, #000 90%); }
.cover .code { position: relative; font-family: var(--font-mono); font-weight: 700; font-size: 2.2rem; letter-spacing: -.02em; line-height: 1; }
.cover .dur { position: absolute; top: 14px; right: 16px; font-size: .78rem; font-weight: 600; background: color-mix(in srgb, var(--accent-ink) 18%, transparent); padding: 4px 10px; border-radius: 99px; }
.course.soon .cover { background: var(--muted); }
.cbody { padding: 18px 20px 20px; display: grid; gap: 12px; align-content: start; }
.course h3 { margin: 0; font-size: 1.18rem; line-height: 1.3; }
.course p { margin: 0; color: var(--muted); font-size: .93rem; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: .74rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--sunken); color: var(--muted); }
.pill.open { background: var(--good-soft); color: var(--good); }
.pill.soon { background: var(--marker-soft); color: var(--marker); }
.bar { height: 6px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.prog { display: grid; gap: 6px; font-size: .82rem; color: var(--muted); }
.cta { font-weight: 700; color: var(--accent); margin-top: 2px; }
.about { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px; margin-bottom: 48px; display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
.about h2 { margin: 0; font-size: 1.15rem; }
.about p { margin: 0; color: var(--muted); max-width: 72ch; }
footer { color: var(--muted); font-size: .85rem; padding: 20px 0 34px; border-top: 1px solid var(--line); }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; padding-top: 34px; gap: 26px; } .about { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./index.html"><span class="logo" aria-hidden="true">PM</span><span id="site-name">Cộng đồng Học Quản lý dự án</span></a>
  <div class="right"><button class="iconbtn" id="tg-theme" aria-label="Đổi giao diện sáng/tối" title="Sáng / tối"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 12.2A7 7 0 017.8 3.5a7 7 0 108.7 8.7z"/></svg></button><div id="account"></div></div>
</div></header>

<main class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow">Khóa học miễn phí · Tiếng Việt</div>
      <h1 id="tagline">Các khóa học miễn phí, thực chiến, bằng tiếng Việt cho người làm CNTT.</h1>
      <p id="login-hint">Học không cần tài khoản. Đăng nhập để lưu tiến độ trên mọi thiết bị và tham gia hỏi đáp.</p>
      <div class="facts" id="facts"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </section>
  <div class="section-head"><h2>Khóa học</h2><span id="count"></span></div>
  <section class="grid" id="courses" aria-label="Danh sách khóa học"></section>
  <section class="about"><h2>Về cộng đồng</h2><p id="about"></p></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script src="platform/config.js"></script>
<script src="courses.js"></script>
<script src="platform/vendor/supabase.js"></script>
<script src="platform/platform.js"></script>
<script>
(function () {
  const CFG = window.SITE_CONFIG || {}, COURSES = window.COURSES || [];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  if (CFG.siteName) { document.getElementById("site-name").textContent = CFG.siteName; document.title = CFG.siteName; }
  if (CFG.tagline) document.getElementById("tagline").textContent = CFG.tagline;
  document.getElementById("about").textContent = CFG.about || "";
  document.getElementById("foot").textContent = "© " + new Date().getFullYear() + " " + (CFG.siteName || "") + " · Nội dung dùng cho mục đích học tập phi lợi nhuận.";
  if (!window.Platform || !Platform.enabled) document.getElementById("login-hint").textContent = "Học ngay, không cần tài khoản. Tiến độ được lưu trên trình duyệt của bạn.";

  function localProgress(slug) {
    try { const raw = localStorage.getItem("qlda-progress-v1:" + slug) || (slug === "qlda-cntt" ? localStorage.getItem("qlda-progress-v1") : null); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function pctOf(data, total) {
    if (!data || !total) return 0;
    const n = Object.values(data.s || {}).filter(Boolean).length + Object.values(data.e || {}).filter(Boolean).length;
    return Math.min(100, Math.round(n / total * 100));
  }
  function initials(t) { return t.split(/\s+/).filter(w => /^[A-ZĐ]/.test(w)).map(w => w[0]).join("").slice(0, 4) || t.slice(0, 2).toUpperCase(); }
  function render(remote) {
    const byCourse = {}; (remote || []).forEach(r => byCourse[r.course] = r.data);
    const open = COURSES.filter(c => c.status !== "soon");
    document.getElementById("count").textContent = open.length + " khóa đang mở" + (COURSES.length > open.length ? " · " + (COURSES.length - open.length) + " sắp ra mắt" : "");
    let best = null;
    document.getElementById("courses").innerHTML = COURSES.map(c => {
      const isOpen = c.status !== "soon";
      const data = byCourse[c.slug] || localProgress(c.slug);
      const pct = pctOf(data, c.totalItems);
      if (isOpen && pct > 0 && pct < 100 && (!best || pct > best.pct)) best = { c, pct };
      const href = `courses/${encodeURIComponent(c.slug)}/index.html`;
      const inner = `<div class="cover"><span class="code">${esc(c.code || initials(c.title))}</span>${c.duration ? `<span class="dur">${esc(c.duration)}</span>` : ""}</div>
        <div class="cbody">
          <div class="meta"><span class="pill ${isOpen ? "open" : "soon"}">${isOpen ? "Đang mở" : "Sắp ra mắt"}</span>${c.level ? `<span class="pill">${esc(c.level)}</span>` : ""}</div>
          <h3>${esc(c.title)}</h3><p>${esc(c.summary || "")}</p>
          ${(c.tags || []).length ? `<div class="meta">${c.tags.map(t => `<span class="pill">${esc(t)}</span>`).join("")}</div>` : ""}
          ${isOpen && pct > 0 ? `<div class="prog"><span>Tiến độ của bạn: <b>${pct}%</b></span><div class="bar"><i style="width:${pct}%"></i></div></div>` : ""}
          ${isOpen ? `<span class="cta">${pct > 0 ? "Học tiếp →" : "Vào học →"}</span>` : ""}
        </div>`;
      return isOpen ? `<a class="course" href="${href}">${inner}</a>` : `<div class="course soon" aria-disabled="true">${inner}</div>`;
    }).join("");
    const first = open[0];
    const panel = document.getElementById("panel");
    if (best) panel.innerHTML = `<div class="k">Đang học</div><h2>${esc(best.c.title)}</h2><div class="prog"><span>Đã hoàn thành <b>${best.pct}%</b></span><div class="bar"><i style="width:${best.pct}%"></i></div></div><a class="btn" href="courses/${encodeURIComponent(best.c.slug)}/index.html">Học tiếp →</a>`;
    else if (first) panel.innerHTML = `<div class="k">Bắt đầu từ đây</div><h2>${esc(first.title)}</h2><p>${esc(first.summary || "")}</p><a class="btn" href="courses/${encodeURIComponent(first.slug)}/index.html">Vào học miễn phí →</a>`;
    const lessons = open.reduce((a, c) => a + (c.lessons || 0), 0);
    document.getElementById("facts").innerHTML = `<div><b>${open.length}</b><span>khóa đang mở</span></div>${lessons ? `<div><b>${lessons}</b><span>buổi học</span></div>` : ""}<div><b>0đ</b><span>miễn phí trọn đời</span></div>`;
  }
  try { const ui = JSON.parse(localStorage.getItem("qlda-ui-v1") || "{}"); if (ui.theme) document.documentElement.setAttribute("data-theme", ui.theme); } catch (e) {}
  document.getElementById("tg-theme").onclick = () => {
    let ui = {}; try { ui = JSON.parse(localStorage.getItem("qlda-ui-v1") || "{}"); } catch (e) {}
    const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    ui.theme = cur === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", ui.theme);
    try { localStorage.setItem("qlda-ui-v1", JSON.stringify(ui)); } catch (e) {}
  };
  render([]);
  if (window.Platform) {
    Platform.mountAccount(document.getElementById("account"));
    const refresh = async () => render(await Platform.listProgress());
    Platform.ready.then(refresh); Platform.onAuthChange(refresh);
  }
})();
</script>
</body>
</html>
